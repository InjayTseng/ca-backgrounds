<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Backgrounds — 會動的背景標本室</title>
<meta name="description" content="Six families of cellular automata as living web background animations — Rule 110, Life, Cyclic CA, Boids, Lenia, and a self-healing Neural CA — each with the idea behind it. 中英雙語。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300;1,9..144,500&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="stage" aria-hidden="true"></div>

  <header class="ui brand">
    <div class="mark">CA<span>/</span>BG</div>
    <div class="brand-text">
      <div class="t1">A specimen room of living backgrounds</div>
      <div class="t2">Six families of cellular automata as living web backgrounds — each with the idea behind it</div>
    </div>
  </header>

  <nav id="tabs" class="ui tabs" role="tablist" aria-label="specimens"></nav>

  <aside class="ui card-wrap">
    <button id="card-toggle" class="card-toggle" aria-label="toggle card">Concept ▸</button>
    <section id="card" class="card" role="tabpanel"></section>
  </aside>

  <footer class="ui toolbar">
    <label class="speed"><span>speed</span>
      <input id="speed" type="range" min="-2" max="2" step="0.25" value="0" aria-label="speed">
      <output id="speedv">1.00×</output>
    </label>
    <button id="pause" title="Space">❚❚</button>
    <button id="reseed" title="R">reseed</button>
    <button id="theme" title="T">☾ dark</button>
    <button id="lang" title="L">中</button>
    <button id="motion" hidden aria-pressed="false" title="Your system prefers reduced motion; press to animate anyway">motion</button>
    <button id="hide" title="H">hide UI</button>
    <span class="keys">1–6 switch · H hide UI · R reseed · Space pause · T theme · L language</span>
  </footer>
  <div class="ui-hint">H</div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
